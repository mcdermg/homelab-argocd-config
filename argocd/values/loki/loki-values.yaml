# One Loki process with its data on a local-path volume: the docs' recommendation for small installs (LAB-148)
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-24"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    query_timeout: 300s
    volume_enabled: true
    # Fewer, bigger pieces per query than the chart's 15m
    split_queries_by_interval: 1h
    # Keep a month of logs so the 10Gi volume doesn't fill
    retention_period: 744h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # The default of 100 queued queries per tenant gave dashboards 429s on the old Loki (LAB-156)
  query_scheduler:
    max_outstanding_requests_per_tenant: 2048
  frontend:
    max_outstanding_per_tenant: 2048

singleBinary:
  replicas: 1
  persistence:
    size: 10Gi
# The SimpleScalable targets; the chart refuses to render with these and singleBinary both running
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Not needed for one small Loki: the nginx gateway, the memcached caches, the canary and the test pod
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
