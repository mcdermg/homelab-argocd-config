server:
  strategy:
    type: Recreate
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.15
    annotations:
      k8status.stenic.io/include: "true"
# Run on the tainted control planes too (LAB-90)
prometheus-node-exporter:
  tolerations:
    - operator: Exists
# KSM only exposes the kube_*_labels metrics for allowlisted resources; the Kubernetes views count
# namespaces, deployments, statefulsets and daemonsets with them (LAB-155). One label each keeps it small
kube-state-metrics:
  metricLabelsAllowlist:
    - namespaces=[kubernetes.io/metadata.name]
    - deployments=[app.kubernetes.io/name]
    - statefulsets=[app.kubernetes.io/name]
    - daemonsets=[app.kubernetes.io/name]
# The Proxmox nodes aren't k8s nodes, so service discovery doesn't find them (LAB-90)
extraScrapeConfigs: |
  - job_name: proxmox-nodes
    static_configs:
      - targets:
          - 192.168.1.250:9100
          - 192.168.1.251:9100
  # Both cloudflared replicas' metrics on the container IP (homelab-proxmox playbook.yaml, LAB-164)
  - job_name: cloudflared
    static_configs:
      - targets:
          - 192.168.1.113:20241
          - 192.168.1.118:20241

# ALERTING (LAB-124): resource health inside the lab and Kubernetes problems. Host up/down belongs
# to Gatus and Pulse, the ISP and the Zero to the Zero's Alertmanager (LAB-122)
alertmanager:
  # Exposed so Gatus on the Zero can check it from outside the cluster, on port 80 (the subchart defaults to 9093)
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.16
    port: 80
  # The Slack webhook stays out of this public repo: homelab-proxmox's k3s.yaml creates the
  # Secret (--tags monitoring). Alertmanager won't start until it exists
  extraSecretMounts:
    - name: slack
      mountPath: /etc/alertmanager/slack
      secretName: alertmanager-slack
      readOnly: true
  config:
    route:
      receiver: slack
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/slack/url
            send_resolved: true
            # Source first, so k3s and Zero alerts in the same channel tell apart at a glance
            title: 'k3s | [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.title }}* - `{{ .Labels.severity }}`
              {{ .Annotations.description }}
              *Alertmanager:* `K3S`
              {{ end }}

serverFiles:
  alerting_rules.yml:
    groups:
      - name: Nodes
        rules:
          - alert: Disk almost full
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"}) * 100 > 90
            for: 10m
            labels:
              severity: warning
            annotations:
              title: 'Disk almost full on {{ $labels.instance }}'
              description: '{{ $labels.mountpoint }} is {{ $value | printf "%.0f" }}% full.'
          - alert: Memory high
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 15m
            labels:
              severity: warning
            annotations:
              title: 'Memory high on {{ $labels.instance }}'
              description: 'Memory use is {{ $value | printf "%.0f" }}%.'
          - alert: CPU high
            expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
            for: 15m
            labels:
              severity: warning
            annotations:
              title: 'CPU high on {{ $labels.instance }}'
              description: 'CPU use is {{ $value | printf "%.0f" }}%.'
          # LAB-110: on 2026-10-14 pve01's NVMe dropped off PCIe, the pool suspended and the guests froze
          # while still answering pings
          - alert: ZFS pool not online
            expr: node_zfs_zpool_state{state="online"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              title: 'ZFS pool {{ $labels.zpool }} not online on {{ $labels.instance }}'
              description: 'The pool is no longer ONLINE; guests on it may be frozen.'

      - name: Kubernetes
        rules:
          # Catches a frozen VM (LAB-110): its kubelet stops reporting even though the VM still pings
          - alert: Node not ready
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              title: 'Node {{ $labels.node }} not ready'
              description: 'The kubelet on {{ $labels.node }} has not reported Ready for 2 minutes.'
          - alert: Pod crash looping
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
            labels:
              severity: warning
            annotations:
              title: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} crash looping'
              description: 'Container {{ $labels.container }} restarted {{ $value | printf "%.0f" }} times in 30 minutes.'
          - alert: Deployment unavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              title: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} unavailable'
              description: '{{ $value | printf "%.0f" }} replica(s) unavailable for 15 minutes.'
