# The Secret stays out of this public repo: homelab-proxmox's k3s.yaml creates it (--tags monitoring, LAB-144).
# Grafana only applies the password on first start, so the Secret has to exist before the volume does
admin:
  existingSecret: grafana-admin

# Recreate, so two pods never open the SQLite database on the same RWO volume
persistence:
  enabled: true
deploymentStrategy:
  type: Recreate

# Fixed uids so dashboards can bind to a data source by uid (LAB-146)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc
        isDefault: true
        # Its scrape interval; Grafana's 15s default makes $__rate_interval too short for rate() on 1m scrapes
        jsonData:
          timeInterval: 1m
      # The Zero's Prometheus on the ISP network: the ISP Blackbox probes, and the lab seen from outside
      - name: prometheus-zero
        uid: prometheus-zero
        type: prometheus
        url: http://192.168.0.62:9090
        jsonData:
          timeInterval: 1m
      - name: loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc:3100

# Dashboards from argocd/manifests/grafana-dashboards, foldered by each ConfigMap's grafana_folder annotation
sidecar:
  dashboards:
    enabled: true
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

# Dashboards from grafana.com, downloaded at pod start; pin a revision, the chart fetches revision 1 without one
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: grafana-com
        folder: Lab
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/grafana-com
      - name: kubernetes
        folder: Kubernetes
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: cloudflare
        folder: Cloudflare
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/cloudflare
      - name: mikrotik
        folder: MikroTik
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/mikrotik
dashboards:
  grafana-com:
    # Has its own data source picker, so it covers both prometheus and prometheus-zero (LAB-154)
    node-exporter-full:
      gnetId: 1860
      revision: 45
  # dotdc's Kubernetes views; each has its own data source picker (LAB-155)
  kubernetes:
    k8s-views-global:
      gnetId: 15757
      revision: 43
    k8s-views-namespaces:
      gnetId: 15758
      revision: 46
    k8s-views-nodes:
      gnetId: 15759
      revision: 40
    k8s-views-pods:
      gnetId: 15760
      revision: 41
    k8s-system-api-server:
      gnetId: 15761
      revision: 21
  # Tunnel health from cloudflared's own metrics (LAB-164); ${DS_PROMETHEUS} is mapped to the prometheus uid (LAB-165)
  cloudflare:
    cloudflare-tunnel:
      gnetId: 24874
      revision: 4
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus
  # The MikroTik from mktxp (LAB-159); needs Grafana 13.2.1 or later (LAB-160)
  mikrotik:
    mikrotik-mktxp:
      gnetId: 13679
      revision: 32
      datasource:
        - name: DS_PROMETHEUS
          value: prometheus

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.14
  annotations:
    k8status.stenic.io/include: "true"
