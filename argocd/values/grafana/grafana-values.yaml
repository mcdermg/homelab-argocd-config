# The Secret stays out of this public repo: homelab-proxmox's k3s.yaml creates it (--tags monitoring, LAB-144).
# Grafana only applies the password on first start, so the Secret has to exist before the volume does
admin:
  existingSecret: grafana-admin

# Recreate, so two pods never open the SQLite database on the same RWO volume
persistence:
  enabled: true
deploymentStrategy:
  type: Recreate

# Fixed uids so dashboards can bind to a data source by uid (LAB-146)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: prometheus
        uid: prometheus
        type: prometheus
        url: http://loki-stack-prometheus-server.monitoring.svc
        isDefault: true
      # The Zero's Prometheus on the ISP network: the ISP Blackbox probes, and the lab seen from outside
      - name: prometheus-zero
        uid: prometheus-zero
        type: prometheus
        url: http://192.168.0.62:9090
      - name: loki
        uid: loki
        type: loki
        url: http://loki-stack.monitoring.svc:3100

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.14
  annotations:
    k8status.stenic.io/include: "true"
