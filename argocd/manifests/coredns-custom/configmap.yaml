# k3s imports *.server keys as extra CoreDNS server blocks (https://docs.k3s.io/advanced)
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # The MikroTik turns bind9's NXDOMAIN for homelab.local into an empty NOERROR, which stops musl (Alpine)
  # resolvers walking the search list, so outside names fail in Alpine pods (LAB-167). Ask the bind9 VIP directly
  homelab.server: |
    homelab.local:53 {
      errors
      cache 30
      forward . 192.168.1.153
    }
