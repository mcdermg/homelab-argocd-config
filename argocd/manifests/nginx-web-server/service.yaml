apiVersion: v1
kind: Service
metadata:
  name: nginx-web-server
  namespace: nginx-web-server
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.12   # pins the IP from the MetalLB pool
    k8status.stenic.io/include: "true"
spec:
  type: LoadBalancer
  selector:
    app: nginx-web-server        # sends traffic to pods with this label
  ports:
    - protocol: TCP
      port: 80                   # port on 192.168.1.12
      targetPort: 80             # port in the container
