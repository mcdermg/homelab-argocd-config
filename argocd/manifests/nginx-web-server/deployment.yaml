apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web-server
  namespace: nginx-web-server
  labels:
    app: nginx-web-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-web-server      # must match the pod template labels below
  template:
    metadata:
      labels:
        app: nginx-web-server    # the Service finds the pods by this label
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports:
            - containerPort: 80
