apiVersion: v1
kind: Service
metadata:
  name: k8status-lb
  namespace: k8status
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.11
    k8status.stenic.io/include: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: k8status       # labels the chart puts on its pods
    app.kubernetes.io/instance: k8status   # = the Application name (ArgoCD uses it as the Helm release name)
  ports:
    - name: http
      port: 80
      targetPort: http                     # the chart's name for the pod's port
