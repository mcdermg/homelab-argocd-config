# Dashboards kept in this repo, one ConfigMap per folder; Grafana's sidecar loads any ConfigMap labelled grafana_dashboard
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboards-isp
    files:
      - isp-blackbox.json
    options:
      annotations:
        grafana_folder: ISP
