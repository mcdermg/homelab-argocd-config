# Dashboards kept in this repo, one ConfigMap per folder; Grafana's sidecar loads any ConfigMap labelled grafana_dashboard
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboards-isp
    files:
      - isp-blackbox.json
    options:
      annotations:
        grafana_folder: ISP
  # Logging Dashboard via Loki (grafana.com 12611 rev 2), kept here because its Loki uid is hard-coded,
  # so the chart's datasource mapping can't remap it (LAB-156)
  - name: grafana-dashboards-lab
    files:
      - loki-logs.json
    options:
      annotations:
        grafana_folder: Lab
