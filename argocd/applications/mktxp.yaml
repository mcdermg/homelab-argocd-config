apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mktxp
  namespace: argocd
  # Deleting the Application also deletes its Deployment and Service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://192.168.1.117/homelab/homelab-argocd-config
    targetRevision: HEAD
    path: argocd/manifests/mktxp
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
