apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulse-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.1.117/homelab/homelab-argocd-config
    targetRevision: HEAD
    path: argocd/manifests/pulse-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: pulse
  # The token Secret pulse-agent-env isn't in this repo: homelab-proxmox's k3s.yaml creates it
  # (--tags monitoring). Until it exists the pod waits in CreateContainerConfigError
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
