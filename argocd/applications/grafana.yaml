apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.0.1
      helm:
        valueFiles:
          - $values/argocd/values/grafana/grafana-values.yaml
    - repoURL: http://192.168.1.117/homelab/homelab-argocd-config
      targetRevision: HEAD
      ref: values
    - repoURL: http://192.168.1.117/homelab/homelab-argocd-config
      targetRevision: HEAD
      path: argocd/manifests/grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
