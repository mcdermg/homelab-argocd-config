apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.1.117/homelab/homelab-argocd-config
    targetRevision: HEAD
    path: argocd/manifests/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  # Created alongside the metallb Application: skip the dry run until its CRDs exist,
  # and retry until its webhook is up to validate the pool
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
