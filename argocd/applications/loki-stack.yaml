apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.9.11
      helm:
        values: |
          promtail:
            enabled: true
          # Grafana is its own Application now (LAB-145)
          grafana:
            enabled: false
            # Its data source ConfigMap made Loki the default; Grafana defines its own now (LAB-146)
            sidecar:
              datasources:
                enabled: false
          # Prometheus and Alertmanager are their own Application now (LAB-147)
          prometheus:
            enabled: false
        valueFiles:
          - $values/argocd/values/loki-stack/loki-values.yaml
    - repoURL: http://192.168.1.117/homelab/homelab-argocd-config
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      annotations:
        k8status.stenic.io/include: "true"
    syncOptions:
      - CreateNamespace=true
