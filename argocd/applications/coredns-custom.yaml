apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-custom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.1.117/homelab/homelab-argocd-config
    targetRevision: HEAD
    path: argocd/manifests/coredns-custom
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
